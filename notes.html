<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="leaf_icon.png">
<meta link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="homeBase">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homeBase — Notes</title>
<style>body{visibility:hidden;}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1e;
    --bg-elevated:#0d1426;
    --panel:#121b31;
    --panel-alt:#16213b;
    --border:#22304f;
    --border-soft:rgba(255,255,255,0.06);
    --text-primary:#eaf0fb;
    --text-secondary:#9aa8c7;
    --text-muted:#66759c;
    --accent:#4c7cf0;
    --accent-hover:#6690ff;
    --accent-soft:rgba(76,124,240,0.14);
    --success:#33d6a6;
    --success-soft:rgba(51,214,166,0.12);
    --warning:#f0b84c;
    --warning-soft:rgba(240,184,76,0.12);
    --danger:#f0664c;
    --danger-soft:rgba(240,102,76,0.13);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --shadow-soft: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-lift: 0 16px 40px rgba(0,0,0,0.45);
    --note-brett:#d97a3a;
    --note-brett-edge:#8f4318;
    --note-brett-text:#fff0c4;
    --note-bernice:#3d6fb0;
    --note-bernice-edge:#254a7a;
    --note-bernice-text:#f0a868;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(76,124,240,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(51,214,166,0.05), transparent 60%),
      var(--bg);
    color:var(--text-primary);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Sora', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .app{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}

  .sidebar{
    background:linear-gradient(180deg, var(--bg-elevated), var(--bg));
    border-right:1px solid var(--border-soft);
    padding:28px 20px; display:flex; flex-direction:column; gap:32px; position:relative;
  }
  .sidebar::before{
    content:""; position:absolute; top:0; left:0; bottom:0; width:2px;
    background:linear-gradient(180deg, var(--accent), transparent 70%); opacity:0.6;
  }
  .brand{display:flex; align-items:center; gap:12px; padding:0 4px;}
  .brand-mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(155deg, var(--accent), #2a4fc4);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(76,124,240,0.35); flex-shrink:0;
  }
  .brand-mark svg{width:24px; height:24px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.25;}
  .brand-text strong{font-family:'Sora'; font-size:15.5px; font-weight:700; letter-spacing:0.2px;}
  .brand-text span{font-size:11.5px; color:var(--text-muted); font-weight:500;}
  .nav{display:flex; flex-direction:column; gap:4px;}
  .nav-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--text-muted); font-weight:600; padding:0 12px; margin-bottom:6px;
  }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:8px; font-size:14px; font-weight:500;
    color:var(--text-secondary); cursor:pointer; transition:background .15s ease, color .15s ease;
    border:1px solid transparent; text-decoration:none;
  }
  .nav-item .left{display:flex; align-items:center; gap:10px;}
  .nav-item svg{width:17px; height:17px; opacity:0.85;}
  .nav-item.active{background:var(--accent-soft); color:var(--text-primary); border-color:rgba(76,124,240,0.35);}
  .nav-item:not(.active):hover{background:rgba(255,255,255,0.03); color:var(--text-primary);}
  .sidebar-footer{
    margin-top:auto; padding-top:18px; border-top:1px dashed var(--border);
    font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px;
  }

  .main{padding:32px 40px 60px; max-width:1280px; width:100%;}
  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
    margin-bottom:28px; flex-wrap:wrap;
  }
  .topbar h1{font-size:26px; font-weight:700; margin:0 0 6px; letter-spacing:-0.3px;}
  .topbar p{margin:0; color:var(--text-secondary); font-size:14px; max-width:50ch;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:10px;
    border:1px solid transparent; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn svg{width:16px; height:16px;}
  .btn-primary{
    background:linear-gradient(155deg, var(--accent-hover), var(--accent)); color:#08101f;
    box-shadow:0 8px 20px rgba(76,124,240,0.28);
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 24px rgba(76,124,240,0.38);}
  .btn-ghost{background:var(--panel); color:var(--text-secondary); border-color:var(--border);}
  .btn-ghost:hover{color:var(--text-primary); border-color:rgba(255,255,255,0.18); background:var(--panel-alt);}
  .actions-row{display:flex; gap:10px; flex-shrink:0; flex-wrap:wrap;}

  .filters{display:flex; gap:10px; align-items:center; margin-bottom:22px; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1; min-width:200px;}
  .search-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-muted);
  }
  .search-wrap input{padding-left:36px;}
  input, select, textarea{
    background:var(--panel); border:1px solid var(--border); color:var(--text-primary);
    padding:9px 12px; border-radius:9px; font-size:13.5px; width:100%; font-family:inherit;
  }
  textarea{resize:vertical; min-height:110px;}
  input::placeholder, textarea::placeholder{color:var(--text-muted);}
  select{cursor:pointer; min-width:150px; width:auto;}

  .owner-toggle{display:flex; gap:8px; flex-wrap:wrap;}
  .owner-toggle button{
    display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:9px;
    border:1px solid var(--border); background:var(--panel); color:var(--text-secondary);
    font-size:13px; font-weight:600; cursor:pointer; transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .owner-toggle button:hover{color:var(--text-primary); border-color:rgba(255,255,255,0.18);}
  .owner-toggle button.selected{color:var(--text-primary); border-color:var(--accent); background:var(--accent-soft);}
  .owner-swatch{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
  .owner-swatch.brett{background:var(--note-brett); box-shadow:0 0 0 1px var(--note-brett-edge) inset;}
  .owner-swatch.bernice{background:var(--note-bernice); box-shadow:0 0 0 1px var(--note-bernice-edge) inset;}

  /* Whiteboard surface */
  .whiteboard{
    background:
      linear-gradient(160deg, #e9edf5, #dde3ee);
    border-radius:var(--radius-lg);
    padding:36px;
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.18), var(--shadow-soft);
    background-image:
      radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(160deg, #e9edf5, #dde3ee);
    background-size:22px 22px, 100% 100%;
    min-height:340px;
  }
  .note-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:34px 26px;
    align-items:start;
  }

  .sticky-note{
    position:relative; min-height:190px; padding:26px 18px 18px;
    border-radius:3px;
    box-shadow:0 10px 22px -6px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.12);
    display:flex; flex-direction:column; gap:8px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .sticky-note:hover{transform:translateY(-4px) rotate(0deg) !important; box-shadow:0 16px 30px -8px rgba(0,0,0,0.4), 0 3px 6px rgba(0,0,0,0.14); z-index:5;}

  @keyframes noteToTrash{
    0%{ transform:translate(0,0) scale(1) rotate(var(--rot,0deg)); opacity:1; }
    100%{ transform:translate(var(--tx), var(--ty)) scale(0.15) rotate(var(--rot,0deg)); opacity:0; }
  }
  .sticky-note.note-to-trash{
    animation:noteToTrash 0.9s ease-in-out forwards;
    pointer-events:none;
    position:relative; z-index:30;
    transform-origin:center center;
  }
  .sticky-note.done{
    filter:grayscale(0.55) brightness(0.88);
    transform:scale(0.9) rotate(-2deg) !important;
    opacity:0.75;
  }
  .sticky-note.done:hover{transform:scale(0.94) rotate(-1deg) !important;}
  .sticky-note.done .sticky-content{text-decoration:line-through; text-decoration-thickness:1.5px;}
  .sticky-note.owner-brett{background:linear-gradient(155deg, #e08a45, #b85a24); border-bottom:3px solid var(--note-brett-edge);}
  .sticky-note.owner-bernice{background:linear-gradient(155deg, #6ba3e0, #2f5c95); border-bottom:3px solid var(--note-bernice-edge);}  

  .sticky-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .sticky-cat{
    font-family:'Inter'; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    padding:3px 8px; border-radius:20px; background:rgba(0,0,0,0.08); flex-shrink:0;
  }
  .owner-brett .sticky-cat{color:var(--note-brett-text);}
  .owner-bernice .sticky-cat{color:var(--note-bernice-text);}

  .sticky-actions{display:flex; gap:2px;}
  .sticky-icon-btn{
    width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; cursor:pointer; flex-shrink:0;
  }
  .owner-brett .sticky-icon-btn{color:var(--note-brett-text);}
  .owner-bernice .sticky-icon-btn{color:var(--note-bernice-text);}
  .sticky-icon-btn:hover{background:rgba(0,0,0,0.08);}
  .sticky-icon-btn svg{width:13px; height:13px;}

  .sticky-title{font-family:'Sora'; font-weight:700; font-size:15.5px; line-height:1.3;}
  .owner-brett .sticky-title{color:var(--note-brett-text);}
  .owner-bernice .sticky-title{color:var(--note-bernice-text);}

  .sticky-content{
    font-family:'Caveat', cursive; font-size:19px; line-height:1.35; white-space:pre-wrap;
    flex:1; word-break:break-word;
  }
  .owner-brett .sticky-content{color:--note-brett-text;}
  .owner-bernice .sticky-content{color:--note-bernice-text;}

  .sticky-footer{
    font-family:'Inter'; font-size:10.5px; margin-top:auto; padding-top:6px; opacity:0.6;
  }
  .owner-brett .sticky-footer{color:var(--note-brett-text);}
  .owner-bernice .sticky-footer{color:var(--note-bernice-text);}

  .sticky-note.note-highlight{
    animation:noteHighlightPulse 1.1s ease-in-out 2;
  }
  @keyframes noteHighlightPulse{
    0%,100%{ box-shadow:0 10px 22px -6px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.12); }
    50%{ box-shadow:0 0 0 5px rgba(255,255,255,0.55), 0 10px 22px -6px rgba(0,0,0,0.35); }
  }
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px; text-align:center; color:#6b7590; grid-column:1/-1;
  }
  .empty-state svg{width:34px; height:34px; margin-bottom:12px; opacity:0.5;}
  .empty-state h3{margin:0 0 6px; color:#4a5170; font-size:15px; font-family:'Sora';}
  .empty-state p{margin:0; font-size:13px;}

  /* Drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(4,7,16,0.6); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:440px; max-width:95vw;
    background:linear-gradient(180deg, var(--bg-elevated), var(--bg));
    border-left:1px solid var(--border); box-shadow:var(--shadow-lift);
    transform:translateX(100%); transition:transform .25s cubic-bezier(.4,0,.2,1);
    z-index:50; display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-header{
    padding:22px 24px; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between;
  }
  .drawer-header h2{font-size:17px; margin:0; font-weight:700;}
  .drawer-close{
    width:30px; height:30px; border-radius:8px; background:var(--panel); border:1px solid var(--border);
    color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .drawer-close:hover{color:var(--text-primary);}
  .drawer-body{padding:22px 24px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:7px;}
  .drawer-footer{padding:18px 24px; border-top:1px solid var(--border-soft); display:flex; gap:10px;}
  .drawer-footer .btn{flex:1; justify-content:center;}
  .drawer-footer .btn.danger-ghost{flex:0 0 auto;}

  .toast{
    position:fixed; bottom:26px; right:26px; background:var(--panel-alt); border:1px solid var(--border);
    padding:13px 18px; border-radius:10px; font-size:13.5px; display:flex; align-items:center; gap:10px;
    box-shadow:var(--shadow-lift); transform:translateY(20px); opacity:0; transition:all .25s ease; z-index:60;
  }
  .toast.show{transform:translateY(0); opacity:1;}
  .toast svg{width:16px; height:16px; color:var(--success); flex-shrink:0;}

  footer.note{margin-top:30px; color:var(--text-muted); font-size:12px; text-align:center;}

  /* Trash can dock */
  .trash-dock{
    position:fixed; right:26px; bottom:26px; width:58px; height:58px; z-index:45;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--panel), var(--panel-alt));
    border:1px solid var(--border-soft); border-radius:16px;
    box-shadow:var(--shadow-lift); color:var(--text-secondary);
  }
  .trash-dock svg{width:27px; height:27px;}
  .trash-dock.bounce{animation:trashBounce 0.45s ease;}
  @keyframes trashBounce{
    0%{transform:scale(1) rotate(0deg);}
    30%{transform:scale(1.12,0.86) rotate(-4deg);}
    55%{transform:scale(0.92,1.08) rotate(3deg);}
    80%{transform:scale(1.04,0.98) rotate(-1deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  .trash-pile{
    position:absolute; bottom:7px; left:50%; transform:translateX(-50%);
    display:flex; gap:3px; pointer-events:none;
  }
  .trash-ball{
    width:9px; height:9px; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,0.4);
    opacity:0.95; transition:opacity 1.2s ease, transform 1.2s ease;
  }
  .trash-ball.fading{opacity:0; transform:translateY(6px) scale(0.6);}
  .trash-ball.ball-brett{background:linear-gradient(155deg,#e08a45,#b85a24);}
  .trash-ball.ball-bernice{background:linear-gradient(155deg,#6ba3e0,#2f5c95);}

  @media (max-width:640px){
    .trash-dock{right:16px; bottom:16px; width:50px; height:50px;}
    .trash-dock svg{width:22px; height:22px;}
  }

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .sidebar{flex-direction:row; align-items:center; padding:16px 20px; gap:16px; overflow-x:auto;}
    .sidebar::before{display:none;}
    .nav{flex-direction:row;}
    .nav-label{display:none;}
    .sidebar-footer{display:none;}
    .main{padding:24px 18px 50px;}
    .whiteboard{padding:20px;}
    .note-grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:26px 16px;}
    .sticky-note:hover{transform:none !important;}
  }
</style>
</head>

          </svg>

        </div>
      </a>
      <a href="property.html" class="nav-item">
        <div class="left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 2.7a5.2 5.2 0 0 0-6.9 6.9l-5.1 5.1a2 2 0 0 0 0 2.8l1.8 1.8a2 2 0 0 0 2.8 0l5.1-5.1a5.2 5.2 0 0 0 6.9-6.9l-3.2 3.2-2.6-.6-.6-2.6 3.2-3.2a5.2 5.2 0 0 0-1.4-1.4Z"/>
            <circle cx="5.5" cy="18.5" r="1"/>
          </svg>
          Home Maintenance
        </div>
      </a>
      <a href="goals.html" class="nav-item">
        <div class="left">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
          </svg>
          Goal Tracker
        </div>
      </a>
      <a href="notes.html" class="nav-item active">
        <div class="left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2h6a2 2 0 0 1 2 2v3.5L21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6l4-4.5V4a2 2 0 0 1 2-2Z"/>
            <path d="M9 2v6H3.8"/>
          </svg>
          Notes
        </div>
      </a>
    </nav>

    <script>
      document.querySelector('.nav .nav-item.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    </script>

    <div class="sidebar-footer">
      <span>homeBase · v0.1</span>
    </div>
  </aside>

  <main class="main">
    <div id="vaultWrap">
      <div class="topbar">
        <div>
          <h1>Notes</h1>
          <p>Sticky notes and lists for Brett & Bernice — jot it down, tick it off.</p>
        </div>
        <div class="actions-row">
          <button class="btn btn-primary" id="addNoteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Add Note
          </button>
        </div>
      </div>

      <div class="filters">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Search notes…">
        </div>
        <div class="owner-toggle" id="ownerFilterGroup">
          <button type="button" class="selected" data-owner-filter="all">All</button>
          <button type="button" data-owner-filter="Brett"><span class="owner-swatch brett"></span> Brett</button>
          <button type="button" data-owner-filter="Bernice"><span class="owner-swatch bernice"></span> Bernice</button>
        </div>
        <div class="owner-toggle" id="statusFilterGroup">
          <button type="button" class="selected" data-status-filter="active">Active</button>
          <button type="button" data-status-filter="done">Done</button>
        </div>
        <select id="categoryFilter">
          <option value="all">All categories</option>
        </select>
      </div>

      <div class="whiteboard">
        <div class="note-grid" id="noteGrid"></div>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 id="drawerTitle">Add Note</h2>
    <button class="drawer-close" id="drawerClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <input type="hidden" id="editId">

    <div class="field">
      <label>Whose note</label>
      <div class="owner-toggle" id="ownerFormGroup">
        <button type="button" data-owner="Brett"><span class="owner-swatch brett"></span> Brett</button>
        <button type="button" data-owner="Bernice"><span class="owner-swatch bernice"></span> Bernice</button>
      </div>
    </div>

    <div class="field">
      <label for="fCategory">Category</label>
      <select id="fCategory">
        <option>To Do</option>
        <option>Shopping List</option>
        <option>Reminder</option>
        <option>Idea</option>
        <option>Important</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <label for="fTitle">Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Weekend list">
    </div>

    <div class="field">
      <label for="fContent">Note</label>
      <textarea id="fContent" placeholder="Write your note or list here…"></textarea>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-ghost danger-ghost" id="deleteNoteBtn" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    </button>
    <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
    <button class="btn btn-primary" id="saveBtn">Save Note</button>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText">Saved</span>
</div>

<div class="trash-dock" id="trashDock" title="Trash">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"/>
    <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>
    <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>
    <path d="M10 11v6"/>
    <path d="M14 11v6"/>
  </svg>
  <div class="trash-pile" id="trashPile"></div>
</div>

<script>
(function(){
  const el = (id) => document.getElementById(id);

  let notes = [];
  let editingId = null;
  let formOwner = 'Brett';
  let ownerFilter = 'all';
  let statusFilter = 'active';
  let targetNoteId = new URLSearchParams(window.location.search).get('note');

  function showToast(msg){
    const toast = el('toast');
    el('toastText').textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function formatDate(d){
    return new Date(d).toLocaleDateString('en-ZA', {day:'2-digit', month:'short', year:'numeric'});
  }
  function rotationFor(id){
    let hash = 0;
    for(let i = 0; i < id.length; i++){ hash = (hash * 31 + id.charCodeAt(i)) % 1000; }
    return ((hash % 7) - 3) * 1.1; // -3.3deg to 3.3deg
  }

  function spawnTrashBall(ownerKey){
    const pile = el('trashPile');
    if(!pile) return;
    const ball = document.createElement('div');
    ball.className = 'trash-ball ' + (ownerKey === 'Bernice' ? 'ball-bernice' : 'ball-brett');
    pile.appendChild(ball);
    while(pile.children.length > 6){ pile.removeChild(pile.firstChild); }
    setTimeout(() => {
      ball.classList.add('fading');
      setTimeout(() => ball.remove(), 1200);
    }, 3 * 60 * 1000); // crumpled ball lingers in the can, then fades after ~3 minutes
  }

  function sendNoteToTrash(id, ownerKey, onLanded){
    const noteEl = document.querySelector(`.sticky-note[data-id="${id}"]`);
    const trash = el('trashDock');
    if(noteEl && trash){
      const noteRect = noteEl.getBoundingClientRect();
      const trashRect = trash.getBoundingClientRect();
      const dx = (trashRect.left + trashRect.width / 2) - (noteRect.left + noteRect.width / 2);
      const dy = (trashRect.top + trashRect.height / 2) - (noteRect.top + noteRect.height / 2);
      noteEl.style.setProperty('--tx', dx + 'px');
      noteEl.style.setProperty('--ty', dy + 'px');
      noteEl.classList.add('note-to-trash');
      noteEl.addEventListener('animationend', () => {
        trash.classList.add('bounce');
        setTimeout(() => trash.classList.remove('bounce'), 450);
        spawnTrashBall(ownerKey);
        onLanded();
      }, { once: true });
    } else {
      spawnTrashBall(ownerKey);
      onLanded();
    }
  }

  async function loadNotes(){
    const { data, error } = await supabaseClient
      .from('notes').select('*').order('created_at', { ascending: false });
    if(error){ showToast('Error loading notes'); console.error(error); return; }
    notes = data;
    refreshCategoryOptions();

    if(targetNoteId){
      const target = notes.find(n => n.id === targetNoteId);
      if(target){
        statusFilter = target.is_done ? 'done' : 'active';
        ownerFilter = 'all';
        document.querySelectorAll('#statusFilterGroup button').forEach(b => b.classList.toggle('selected', b.dataset.statusFilter === statusFilter));
        document.querySelectorAll('#ownerFilterGroup button').forEach(b => b.classList.toggle('selected', b.dataset.ownerFilter === 'all'));
        el('categoryFilter').value = 'all';
        el('searchInput').value = '';
      }
    }

    renderNotes();

    if(targetNoteId){
      const idToFind = targetNoteId;
      requestAnimationFrame(() => {
        const targetEl = document.querySelector(`.sticky-note[data-id="${idToFind}"]`);
        if(targetEl){
          targetEl.scrollIntoView({ behavior:'smooth', block:'center' });
          targetEl.classList.add('note-highlight');
          setTimeout(() => targetEl.classList.remove('note-highlight'), 2300);
        }
      });
      targetNoteId = null;
      history.replaceState(null, '', window.location.pathname);
    }
  }

  function refreshCategoryOptions(){
    const catFilter = el('categoryFilter');
    const cats = Array.from(new Set(notes.map(n => n.category))).sort();
    const current = catFilter.value;
    catFilter.innerHTML = '<option value="all">All categories</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if(cats.includes(current)) catFilter.value = current;
  }

  function getFiltered(){
    const q = el('searchInput').value.trim().toLowerCase();
    const cat = el('categoryFilter').value;
    return notes.filter(n => {
      const matchesQ = !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q);
      const matchesOwner = ownerFilter === 'all' || n.owner === ownerFilter;
      const matchesCat = cat === 'all' || n.category === cat;
      const matchesStatus = statusFilter === 'done' ? !!n.is_done : !n.is_done;
      return matchesQ && matchesOwner && matchesCat && matchesStatus;
    });
  }

  function renderNotes(){
    const grid = el('noteGrid');
    const list = getFiltered();
    if(list.length === 0){
      const msg = statusFilter === 'done'
        ? { title: 'No done notes', body: 'Tick a note off and it\'ll land here.' }
        : { title: 'No notes yet', body: 'Click Add Note to stick the first one up.' };
      grid.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h6a2 2 0 0 1 2 2v3.5L21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6l4-4.5V4a2 2 0 0 1 2-2Z"/><path d="M9 2v6H3.8"/></svg>
          <h3>${msg.title}</h3>
          <p>${msg.body}</p>
        </div>`;
      return;
    }
    grid.innerHTML = list.map(n => {
      const ownerClass = n.owner === 'Bernice' ? 'owner-bernice' : 'owner-brett';
      const rot = rotationFor(n.id);
      const doneClass = n.is_done ? ' done' : '';
      const actions = n.is_done ? `
            <button class="sticky-icon-btn" data-restore="${n.id}" aria-label="Restore note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            </button>
            <button class="sticky-icon-btn" data-del="${n.id}" aria-label="Delete note forever">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
            </button>
          ` : `
            <button class="sticky-icon-btn" data-tick="${n.id}" aria-label="Mark done">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <button class="sticky-icon-btn" data-edit="${n.id}" aria-label="Edit note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>
            </button>
            <button class="sticky-icon-btn" data-del="${n.id}" aria-label="Delete note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          `;
      return `
      <div class="sticky-note ${ownerClass}${doneClass}" style="--rot:${rot}deg; transform:rotate(${rot}deg);" data-id="${n.id}">
        <div class="sticky-pin"></div>
        <div class="sticky-top">
          <span class="sticky-cat">${escapeHtml(n.category)}</span>
          <div class="sticky-actions">${actions}</div>
        </div>
        ${n.title ? `<div class="sticky-title">${escapeHtml(n.title)}</div>` : ''}
        <div class="sticky-content">${escapeHtml(n.content)}</div>
        <div class="sticky-footer">${escapeHtml(n.owner)} · ${formatDate(n.created_at)}</div>
      </div>
    `;
    }).join('');
  }

  // ---- filters ----
  el('ownerFilterGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-owner-filter]');
    if(!btn) return;
    ownerFilter = btn.dataset.ownerFilter;
    document.querySelectorAll('#ownerFilterGroup button').forEach(b => b.classList.toggle('selected', b === btn));
    renderNotes();
  });
  el('statusFilterGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-status-filter]');
    if(!btn) return;
    statusFilter = btn.dataset.statusFilter;
    document.querySelectorAll('#statusFilterGroup button').forEach(b => b.classList.toggle('selected', b === btn));
    renderNotes();
  });
  el('searchInput').addEventListener('input', renderNotes);
  el('categoryFilter').addEventListener('change', renderNotes);

  // ---- drawer ----
  function updateOwnerFormSelection(){
    document.querySelectorAll('#ownerFormGroup button').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.owner === formOwner);
    });
  }
  el('ownerFormGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-owner]');
    if(!btn) return;
    formOwner = btn.dataset.owner;
    updateOwnerFormSelection();
  });

  function openDrawer(note){
    editingId = note ? note.id : null;
    el('drawerTitle').textContent = note ? 'Edit Note' : 'Add Note';
    el('editId').value = note ? note.id : '';
    formOwner = note ? note.owner : 'Brett';
    updateOwnerFormSelection();
    el('fCategory').value = note ? note.category : 'To Do';
    el('fTitle').value = note ? (note.title || '') : '';
    el('fContent').value = note ? (note.content || '') : '';
    el('deleteNoteBtn').style.display = note ? 'flex' : 'none';
    el('drawer').classList.add('show');
    el('overlay').classList.add('show');
    setTimeout(() => el('fTitle').focus(), 200);
  }
  function closeDrawer(){
    el('drawer').classList.remove('show');
    el('overlay').classList.remove('show');
    editingId = null;
  }

  el('addNoteBtn').addEventListener('click', () => openDrawer(null));
  el('drawerClose').addEventListener('click', closeDrawer);
  el('cancelBtn').addEventListener('click', closeDrawer);
  el('overlay').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && el('drawer').classList.contains('show')) closeDrawer(); });

  el('saveBtn').addEventListener('click', async () => {
    const content = el('fContent').value.trim();
    if(!content){ el('fContent').focus(); return; }
    const payload = {
      owner: formOwner,
      category: el('fCategory').value,
      title: el('fTitle').value.trim(),
      content
    };

    let error;
    if(editingId){
      ({ error } = await supabaseClient.from('notes').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('notes').insert(payload));
    }
    if(error){ showToast('Save failed'); console.error(error); return; }

    showToast(editingId ? 'Note updated' : 'Note added');
    closeDrawer();
    await loadNotes();
  });

  el('deleteNoteBtn').addEventListener('click', async () => {
    if(!editingId) return;
    if(!confirm('Remove this note? This can\'t be undone.')) return;
    const id = editingId;
    const note = notes.find(n => n.id === id);
    closeDrawer();
    sendNoteToTrash(id, note ? note.owner : 'Brett', () => {
      supabaseClient.from('notes').delete().eq('id', id).then(({ error }) => {
        if(error){ showToast('Delete failed'); console.error(error); return; }
        loadNotes();
        showToast('Note removed');
      });
    });
  });

  el('noteGrid').addEventListener('click', (e) => {
    const tickBtn = e.target.closest('[data-tick]');
    const restoreBtn = e.target.closest('[data-restore]');
    const editBtn = e.target.closest('[data-edit]');
    const delBtn = e.target.closest('[data-del]');

    if(tickBtn){
      const id = tickBtn.dataset.tick;
      const note = notes.find(n => n.id === id);
      sendNoteToTrash(id, note ? note.owner : 'Brett', async () => {
        const { error } = await supabaseClient.from('notes')
          .update({ is_done: true, completed_at: new Date().toISOString() }).eq('id', id);
        if(error){ showToast('Could not mark note done'); console.error(error); await loadNotes(); return; }
        await loadNotes();
        showToast('Note marked done');
      });
      return;
    }

    if(restoreBtn){
      const id = restoreBtn.dataset.restore;
      supabaseClient.from('notes').update({ is_done: false, completed_at: null }).eq('id', id).then(({ error }) => {
        if(error){ showToast('Could not restore note'); console.error(error); return; }
        loadNotes();
        showToast('Note restored');
      });
      return;
    }

    if(editBtn){
      const note = notes.find(n => n.id === editBtn.dataset.edit);
      if(note) openDrawer(note);
      return;
    }

    if(delBtn){
      const note = notes.find(n => n.id === delBtn.dataset.del);
      if(!note) return;
      if(!confirm('Remove this note? This can\'t be undone.')) return;
      sendNoteToTrash(note.id, note.owner, () => {
        supabaseClient.from('notes').delete().eq('id', note.id).then(({ error }) => {
          if(error){ showToast('Delete failed'); console.error(error); return; }
          loadNotes();
          showToast('Note removed');
        });
      });
    }
  });

  updateOwnerFormSelection();
  loadNotes();
})();
</script>

</body>
</html>
