<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="leaf_icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="homeBase">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homeBase — Chores</title>
<style>body{visibility:hidden;}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1e;
    --bg-elevated:#0d1426;
    --panel:#121b31;
    --panel-alt:#16213b;
    --border:#22304f;
    --border-soft:rgba(255,255,255,0.06);
    --text-primary:#eaf0fb;
    --text-secondary:#9aa8c7;
    --text-muted:#66759c;
    --accent:#4c7cf0;
    --accent-hover:#6690ff;
    --accent-soft:rgba(76,124,240,0.14);
    --success:#33d6a6;
    --success-soft:rgba(51,214,166,0.12);
    --warning:#f0b84c;
    --warning-soft:rgba(240,184,76,0.12);
    --danger:#f0664c;
    --danger-soft:rgba(240,102,76,0.13);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --shadow-soft: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-lift: 0 16px 40px rgba(0,0,0,0.45);
    
    /* Family Member Signature Colors */
    --clr-brett:#f0664c;
    --clr-bernice:#33d6a6;
    --clr-cole:#4c7cf0;
    --clr-dakota:#f0b84c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(76,124,240,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(51,214,166,0.05), transparent 60%),
      var(--bg);
    color:var(--text-primary);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Sora', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .app{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}

  .sidebar{
    background:linear-gradient(180deg, var(--bg-elevated), var(--bg));
    border-right:1px solid var(--border-soft);
    padding:28px 20px; display:flex; flex-direction:column; gap:32px; position:relative;
  }
  .sidebar::before{
    content:""; position:absolute; top:0; left:0; bottom:0; width:2px;
    background:linear-gradient(180deg, var(--accent), transparent 70%); opacity:0.6;
  }
  .brand{display:flex; align-items:center; gap:12px; padding:0 4px;}
  .brand-mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(155deg, var(--accent), #befffd);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(76,124,240,0.35); flex-shrink:0;
  }
  .brand-mark img{width:24px; height:24px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.25;}
  .brand-text strong{font-family:'Sora'; font-size:15.5px; font-weight:700; letter-spacing:0.2px;}
  .brand-text span{font-size:11.5px; color:var(--text-muted); font-weight:500;}
  .nav{display:flex; flex-direction:column; gap:4px;}
  .nav-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--text-muted); font-weight:600; padding:0 12px; margin-bottom:6px;
  }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:8px; font-size:14px; font-weight:500;
    color:var(--text-secondary); cursor:pointer; transition:background .15s ease, color .15s ease;
    border:1px solid transparent; text-decoration:none;
  }
  .nav-item .left{display:flex; align-items:center; gap:10px;}
  .nav-item svg{width:17px; height:17px; opacity:0.85;}
  .nav-item.active{background:var(--accent-soft); color:var(--text-primary); border-color:rgba(76,124,240,0.35);}
  .nav-item:not(.active):hover{background:rgba(255,255,255,0.03); color:var(--text-primary);}
  .sidebar-footer{
    margin-top:auto; padding-top:18px; border-top:1px dashed var(--border);
    font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px;
  }

  .main{padding:32px 40px 60px; max-width:1280px; width:100%;}
  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
    margin-bottom:28px; flex-wrap:wrap;
  }
  .topbar h1{font-size:26px; font-weight:700; margin:0 0 6px; letter-spacing:-0.3px;}
  .topbar p{margin:0; color:var(--text-secondary); font-size:14px; max-width:50ch;}

  /* Chore Arena Board Component - Replacing Curtain Layout */
  .chore-board {
    position: relative;
    border-radius: var(--radius-lg);
    padding: 40px 24px;
    box-shadow: inset 0 4px 30px rgba(0,0,0,0.7), var(--shadow-lift);
    min-height: 580px;
    overflow: hidden;    
    background: 
      radial-gradient(circle at 50% 30%, rgba(76,124,240,0.12) 0%, transparent 65%),
      linear-gradient(180deg, #0d162d 0%, #070b16 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }

  /* Cybernetic Grid Overlay Lines */
  .chore-board::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 30px 30px;
    background-position: center top;
    mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 90%);
  }

  /* Wheel Main Outer Ring Assembly */
  .wheel-frame {
    position: relative;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    padding: 12px;
    background: linear-gradient(135deg, #1b2847, #0b1121);
    box-shadow: 
      0 0 0 4px #223563,
      0 14px 36px rgba(0,0,0,0.6),
      inset 0 4px 12px rgba(255,255,255,0.05);
  }

  /* Physical Top Center Indicator Arrow pointer */
  .wheel-pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 24px solid #fff;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    z-index: 10;
  }

  /* The Turning Component Elements */
  .wheel-canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.35, 1);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }

  /* Visual Sector Graphics */
  .wheel-sector {
    position: absolute;
    width: 50%;
    height: 50%;
    transform-origin: 100% 100%;
    left: 0;
    top: 0;
  }
  
  /* Slices rotated perfectly by 90-degree quadrant metrics */
  .sector-1 { transform: rotate(0deg); background: var(--clr-brett); }
  .sector-2 { transform: rotate(90deg); background: var(--clr-bernice); }
  .sector-3 { transform: rotate(180deg); background: var(--clr-cole); }
  .sector-4 { transform: rotate(270deg); background: var(--clr-dakota); }

  /* Family Labels text tracking inside sectors */
  .sector-name {
    position: absolute;
    bottom: 30px;
    right: 30px;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #060a13;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transform: rotate(45deg);
    transform-origin: center;
  }

  /* Central Mechanical Actuator Trigger */
  .wheel-trigger {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #ffffff;
    border: 5px solid #1c2b4f;
    color: #0a0f1e;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
    z-index: 5;
    transition: transform 0.1s ease;
  }
  .wheel-trigger:active { transform: translate(-50%, -50%) scale(0.93); }

  /* Live Display read-out tracking target allocations */
  .announcement-box {
    min-height: 80px;
    text-align: center;
    max-width: 500px;
    width: 100%;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft);
  }
  .announcement-title {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin: 0 0 6px;
  }
  .announcement-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }
  .highlight-name { font-family: 'Sora'; font-weight: 800; transition: color 0.3s; }

  /* Mobile Media Configuration adjustments */
  @media (max-width: 768px) {
    .app { display: flex; flex-direction: column; }
    .main { padding: 16px; margin: 0 auto; }
    .wheel-frame { width: 290px; height: 290px; }
    .sector-name { bottom: 20px; right: 20px; font-size: 15px; }
    .chore-board { min-height: 480px; padding: 24px 12px; }
  }
</style>
</head>
<body style="visibility: visible;">
