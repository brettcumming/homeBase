<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fffdf6;
    --paper-line:#dfe6f0;
    --ink:#2b2b33;
    --ink-soft:#5c5c68;
    --check:#2f9e5e;
    --magnet-red:#e3473c;
    --magnet-blue:#3b6fe0;
    --magnet-yellow:#f0b93c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
    font-family:'Kalam', cursive;
    background:
      radial-gradient(1400px 900px at 50% -10%, rgba(255,255,255,0.10), transparent 60%),
      linear-gradient(155deg, #c7ccd4, #9aa1ac 45%, #7d838d 100%);
    background-attachment:fixed;
  }
  /* brushed-steel fridge door texture */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }

  .fridge-scene{ position:relative; z-index:1; }

  /* the notepad, "stuck" to the fridge at a slight tilt */
  .notepad{
    position:relative;
    width:360px;
    max-width:88vw;
    background:var(--paper);
    border-radius:4px;
    padding:34px 26px 26px;
    box-shadow:
      0 22px 40px -12px rgba(0,0,0,0.45),
      0 4px 10px rgba(0,0,0,0.2);
    transform:rotate(-1.3deg);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size:100% 34px;
    background-position:0 78px;
  }

  /* torn / ragged top edge */
  .notepad::before{
    content:"";
    position:absolute; top:-1px; left:0; right:0; height:14px;
    background:
      linear-gradient(135deg, transparent 50%, var(--paper) 50%) 0 0/14px 14px repeat-x,
      linear-gradient(-135deg, transparent 50%, var(--paper) 50%) 0 0/14px 14px repeat-x;
    background-position: 0 0, 7px 0;
  }

  /* magnet pinning the note in place */
  .magnet{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%) rotate(4deg);
    width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ff9c8e, var(--magnet-red) 65%);
    box-shadow:
      0 6px 10px rgba(0,0,0,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.25),
      inset 0 3px 4px rgba(255,255,255,0.4);
    z-index:3;
  }
  .magnet::after{
    content:""; position:absolute; inset:13px; border-radius:50%;
    background:rgba(255,255,255,0.35);
  }

  /* little decorative fridge magnets scattered around, just for fun */
  .deco-magnet{
    position:absolute; border-radius:10px; z-index:2;
    box-shadow:0 8px 14px rgba(0,0,0,0.35), inset 0 2px 3px rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; user-select:none;
  }
  .deco-magnet.a{
    top:-40px; left:-38px; width:52px; height:52px;
    background:radial-gradient(circle at 32% 28%, #ffe27a, var(--magnet-yellow) 70%);
    transform:rotate(-14deg);
  }
  .deco-magnet.b{
    bottom:-26px; right:-30px; width:56px; height:44px; border-radius:14px;
    background:radial-gradient(circle at 32% 28%, #8fb4ff, var(--magnet-blue) 75%);
    transform:rotate(9deg);
  }

  .title-row{ text-align:center; margin-bottom:6px; }
  h1{
    font-family:'Permanent Marker', cursive;
    font-size:26px; color:var(--ink); margin:0;
    transform:rotate(-0.6deg);
    text-shadow:1px 1px 0 rgba(0,0,0,0.06);
  }
  .subtitle{
    text-align:center; font-size:13px; color:var(--ink-soft); margin:2px 0 18px;
  }

  .add-row{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .add-row input{
    flex:1; border:none; border-bottom:2px dashed #c7cfdd; background:transparent;
    font-family:'Kalam', cursive; font-size:16px; color:var(--ink); padding:6px 2px;
  }
  .add-row input::placeholder{ color:#a6adba; }
  .add-row input:focus{ outline:none; border-bottom-color:var(--check); }
  .add-btn{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:var(--check); color:#fff; font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,0.25);
  }
  .add-btn:active{ transform:scale(0.94); }

  .list{ list-style:none; margin:0; padding:0; min-height:40px; }
  .item{
    display:flex; align-items:center; gap:10px;
    padding:5px 0; height:34px;
    font-size:18px; color:var(--ink);
    animation:popIn .18s ease;
  }
  @keyframes popIn{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; transform:translateY(0);} }

  .item .box{
    width:20px; height:20px; flex-shrink:0; border-radius:5px;
    border:2.2px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:transparent;
  }
  .item .box svg{ width:14px; height:14px; opacity:0; stroke:var(--check); stroke-width:3.4; transition:opacity .1s ease; }
  .item.done .box{ border-color:var(--check); background:rgba(47,158,94,0.08); }
  .item.done .box svg{ opacity:1; }

  .item .label{
    flex:1; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .item.done .label{ color:#9a9fa9; text-decoration:line-through; text-decoration-thickness:2px; }

  .item .del{
    width:22px; height:22px; border:none; background:none; cursor:pointer; flex-shrink:0;
    color:#c6ccd6; display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .item .del:hover{ color:var(--magnet-red); background:rgba(227,71,60,0.08); }
  .item .del svg{ width:13px; height:13px; }

  .empty-msg{
    text-align:center; color:#a6adba; font-size:14px; padding:14px 0 6px; font-style:italic;
  }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px; padding-top:12px; border-top:1px dashed #d8dee8;
    font-size:12.5px; color:var(--ink-soft);
  }
  .footer-row .count{ font-weight:700; }
  .footer-actions{ display:flex; gap:12px; }
  .footer-actions button{
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
    font-family:'Kalam', cursive; font-size:12.5px; text-decoration:underline;
    padding:0;
  }
  .footer-actions button:hover{ color:var(--magnet-red); }

  @media (max-width:420px){
    .notepad{ width:320px; padding:30px 20px 22px; }
    h1{ font-size:23px; }
  }
</style>
</head>
<body>

<div class="fridge-scene">
  <div class="notepad">
    <div class="magnet"></div>
    <div class="deco-magnet a">🍅</div>
    <div class="deco-magnet b">🥦</div>

    <div class="title-row">
      <h1>Shopping List</h1>
    </div>
    <p class="subtitle">Stuck to the fridge, as usual.</p>

    <div class="add-row">
      <input type="text" id="itemInput" placeholder="milk, eggs, bread…" maxlength="80">
      <button class="add-btn" id="addBtn" aria-label="Add item">+</button>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty-msg" id="emptyMsg" style="display:none;">List's empty — go on, add something.</div>

    <div class="footer-row">
      <span><span class="count" id="countLabel">0</span> to get</span>
      <div class="footer-actions">
        <button id="clearCheckedBtn">Clear checked</button>
        <button id="clearAllBtn">Clear all</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'fridgeShoppingList';
  const el = (id) => document.getElementById(id);

  const EMOJI_MAP = [
    [/milk/, '🥛'], [/egg/, '🥚'], [/bread/, '🍞'], [/butter/, '🧈'],
    [/cheese/, '🧀'], [/apple/, '🍎'], [/banana/, '🍌'], [/tomato/, '🍅'],
    [/potato/, '🥔'], [/onion/, '🧅'], [/carrot/, '🥕'], [/chicken/, '🍗'],
    [/beef|mince|steak/, '🥩'], [/fish/, '🐟'], [/rice/, '🍚'], [/pasta|spaghetti/, '🍝'],
    [/coffee/, '☕'], [/tea\b/, '🍵'], [/juice/, '🧃'], [/water/, '💧'],
    [/wine/, '🍷'], [/beer/, '🍺'], [/chocolate|choc/, '🍫'], [/biscuit|cookie/, '🍪'],
    [/toilet paper|tissue/, '🧻'], [/soap/, '🧼'], [/washing|detergent/, '🧴'],
    [/onion/, '🧅'], [/garlic/, '🧄'], [/lemon/, '🍋'], [/orange/, '🍊'],
    [/avocado/, '🥑'], [/cereal/, '🥣'], [/yoghurt|yogurt/, '🥄'], [/sugar/, '🧂'],
    [/flour/, '🌾'], [/nappies|diaper/, '👶'], [/dog|pet food/, '🐾'],
  ];

  let items = [];

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    } catch(e){ items = []; }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function emojiFor(text){
    const lower = text.toLowerCase();
    for(const [re, emoji] of EMOJI_MAP){
      if(re.test(lower)) return emoji + ' ';
    }
    return '';
  }

  function render(){
    const list = el('list');
    const emptyMsg = el('emptyMsg');

    if(items.length === 0){
      list.innerHTML = '';
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      list.innerHTML = items.map(item => `
        <li class="item ${item.done ? 'done' : ''}" data-id="${item.id}">
          <button class="box" data-toggle="${item.id}" aria-label="Toggle done">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <span class="label" data-toggle="${item.id}">${emojiFor(item.text)}${escapeHtml(item.text)}</span>
          <button class="del" data-del="${item.id}" aria-label="Remove item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </li>
      `).join('');
    }

    const remaining = items.filter(i => !i.done).length;
    el('countLabel').textContent = remaining;
  }

  function addItem(text){
    const trimmed = text.trim();
    if(!trimmed) return;
    items.unshift({ id: crypto.randomUUID(), text: trimmed, done: false });
    save();
    render();
  }

  el('addBtn').addEventListener('click', () => {
    addItem(el('itemInput').value);
    el('itemInput').value = '';
    el('itemInput').focus();
  });
  el('itemInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      addItem(el('itemInput').value);
      el('itemInput').value = '';
    }
  });

  el('list').addEventListener('click', (e) => {
    const toggleBtn = e.target.closest('[data-toggle]');
    const delBtn = e.target.closest('[data-del]');
    if(toggleBtn){
      const item = items.find(i => i.id === toggleBtn.dataset.toggle);
      if(item){ item.done = !item.done; save(); render(); }
    }
    if(delBtn){
      items = items.filter(i => i.id !== delBtn.dataset.del);
      save();
      render();
    }
  });

  el('clearCheckedBtn').addEventListener('click', () => {
    if(!items.some(i => i.done)) return;
    items = items.filter(i => !i.done);
    save();
    render();
  });
  el('clearAllBtn').addEventListener('click', () => {
    if(items.length === 0) return;
    if(!confirm('Clear the whole list?')) return;
    items = [];
    save();
    render();
  });

  load();
  render();
})();
</script>

</body>
</html>
